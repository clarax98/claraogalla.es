<!DOCTYPE html>
<html data-bs-theme="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>Mensaje enviado — Clara Ogalla Moreno</title>
  <link rel="canonical" href="https://claraogalla.es/thanks.html">
  <link rel="icon" type="image/png" href="assets/img/logo%20clara.png">
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/styles.min.css">

  <style>
    :root {
      --accent:       #7c3aed;
      --accent-light: #a78bfa;
      --accent-dark:  #6d28d9;
      --bg:           #09090f;
      --border:       rgba(255,255,255,0.07);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); }

    #mainNav {
      background: rgba(9,9,15,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(124,58,237,0.18);
    }
    #mainNav .nav-link {
      color: #9ca3af;
      font-size: .88rem;
      letter-spacing: .03em;
      transition: color .2s;
    }
    #mainNav .nav-link:hover { color: var(--accent-light); }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border: none;
      color: #fff;
      padding: .6rem 1.6rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: .9rem;
      box-shadow: 0 4px 20px rgba(124,58,237,.35);
      transition: box-shadow .2s, transform .15s;
    }
    .btn-accent:hover {
      color: #fff;
      box-shadow: 0 6px 30px rgba(124,58,237,.55);
      transform: translateY(-2px);
    }
    .btn-outline-accent {
      border: 1px solid rgba(124,58,237,.5);
      color: var(--accent-light);
      background: rgba(124,58,237,.06);
      padding: .6rem 1.6rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: .9rem;
      transition: background .2s, border-color .2s, transform .15s;
    }
    .btn-outline-accent:hover {
      background: rgba(124,58,237,.14);
      border-color: var(--accent-light);
      color: var(--accent-light);
      transform: translateY(-2px);
    }

    .thanks-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1rem;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 60% 70% at 50% 50%, rgba(124,58,237,.15) 0%, transparent 65%),
        var(--bg);
    }
    .thanks-wrap::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,.08) 0%, transparent 70%);
      top: -100px; left: -150px;
      pointer-events: none;
    }

    .thanks-card {
      position: relative;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(124,58,237,.25);
      border-radius: 20px;
      padding: 3.5rem 3rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 60px rgba(124,58,237,.12);
      animation: fadeUp .6s .1s ease both;
    }

    .thanks-icon {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 1.2rem;
      animation: pop .5s .3s cubic-bezier(.22,1,.36,1) both;
    }

    .thanks-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: .6rem;
      background: linear-gradient(120deg, #fff 20%, var(--accent-light) 70%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .thanks-sub {
      color: #6b7280;
      font-size: .97rem;
      line-height: 1.65;
      margin-bottom: 2.2rem;
    }

    .thanks-divider {
      width: 48px; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      border-radius: 2px;
      margin: 0 auto 2rem;
    }

    footer { border-top: 1px solid var(--border); }
    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      color: #6b7280;
      font-size: 1.1rem;
      transition: border-color .2s, color .2s, background .2s;
      text-decoration: none;
    }
    .social-link:hover {
      border-color: var(--accent);
      color: var(--accent-light);
      background: rgba(124,58,237,.08);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(.6); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>

  <!-- ══════════ NAVBAR ══════════ -->
  <nav class="navbar navbar-expand-md sticky-top py-3" id="mainNav">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img src="assets/img/logo%20clara.png" height="36" class="rounded-circle" alt="Logo Clara">
        <span class="fw-bold" style="color: var(--accent-light);">Clara Ogalla</span>
      </a>
      <button class="navbar-toggler border-0" data-bs-toggle="collapse" data-bs-target="#navcol-1">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navcol-1">
        <ul class="navbar-nav mx-auto gap-1">
          <li class="nav-item"><a class="nav-link" href="/#sobre-mi">Sobre mí</a></li>
          <li class="nav-item"><a class="nav-link" href="/#proyectos">Proyectos</a></li>
          <li class="nav-item"><a class="nav-link" href="/#experiencia">Experiencia</a></li>
          <li class="nav-item"><a class="nav-link" href="/#contacto">Contacto</a></li>
        </ul>
        <a class="btn btn-accent" href="https://github.com/clarax98" target="_blank" rel="noopener">
          <i class="bi bi-github me-1"></i>GitHub
        </a>
      </div>
    </div>
  </nav>

  <!-- ══════════ THANKS ══════════ -->
  <div class="thanks-wrap">
    <div class="thanks-card">
      <span class="thanks-icon">✉️</span>
      <h1 class="thanks-title">¡Mensaje enviado!</h1>
      <div class="thanks-divider"></div>
      <p class="thanks-sub">Gracias por escribirme. He recibido tu mensaje y te responderé lo antes posible.</p>
      <div class="d-flex flex-wrap justify-content-center gap-3">
        <a href="/" class="btn btn-accent"><i class="bi bi-house me-1"></i>Volver al inicio</a>
        <a href="/#proyectos" class="btn btn-outline-accent"><i class="bi bi-grid me-1"></i>Ver proyectos</a>
      </div>
    </div>
  </div>

  <!-- ══════════ FOOTER ══════════ -->
  <footer class="py-5" style="background: var(--bg);">
    <div class="container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <div class="d-flex align-items-center gap-2">
          <img src="assets/img/logo%20clara.png" height="32" class="rounded-circle" alt="Logo">
          <span class="fw-bold" style="color: var(--accent-light);">Clara Ogalla Moreno</span>
        </div>
        <div class="d-flex gap-2">
          <a class="social-link" href="https://github.com/clarax98" target="_blank" rel="noopener" title="GitHub">
            <i class="bi bi-github"></i>
          </a>
          <a class="social-link" href="mailto:claraogalla@gmail.com" title="Email">
            <i class="bi bi-envelope-fill"></i>
          </a>
        </div>
        <p class="mb-0 text-muted small">© 2025 Clara Ogalla Moreno</p>
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.min.js"></script>

</body>
</html>
